
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gitworkflow-api
    restart: unless-stopped
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      CORS_ORIGIN: https://gitworkflow.duckdns.org
      DOCKER_IMAGE: git-sandbox
      SCENARIOS_PATH: /home/ubuntu/git-workflow-simulator/apps/api/scenarios
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/git-workflow-simulator/apps/api/scenarios:/home/ubuntu/git-workflow-simulator/apps/api/scenarios:ro
    ports:
      - "127.0.0.1:5000:5000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://gitworkflow.duckdns.org
        NEXT_PUBLIC_WS_URL: wss://gitworkflow.duckdns.org
    container_name: gitworkflow-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
